<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Server Firefox</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262a33;--tx:#e8e6e3;--mut:#8b909a;--acc:#ff7139;--ok:#3ecf8e;--bad:#ff5d5d;--warn:#f5b84a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Vazirmatn,Tahoma,system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
h1{font-size:20px;margin:0;display:flex;gap:10px;align-items:center}h1 i{width:12px;height:12px;border-radius:50%;background:var(--acc);display:inline-block}
.mut{color:var(--mut);font-size:13px}
button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:#3a3f4a}.pri{background:var(--acc);border-color:var(--acc);color:#111;font-weight:600}.pri:hover{border-color:#ff9a6e}
.danger{color:var(--bad)}button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.name{font-weight:600;font-size:16px}.meta{direction:ltr;text-align:right;color:var(--mut);font-size:13px}
.badge{font-size:12px;padding:2px 9px;border-radius:20px;border:1px solid var(--line)}
.s-installed{color:var(--ok);border-color:#24533f}.s-failed{color:var(--bad);border-color:#5a2a2a}.s-installing{color:var(--warn);border-color:#5a4a22}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.err{color:var(--bad);font-size:13px;margin-top:8px}
pre{direction:ltr;text-align:left;background:#0b0c0f;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:360px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,monospace;margin:12px 0 0;white-space:pre-wrap}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(520px,94vw)}
dialog::backdrop{background:#000a}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;background:#0f1115;color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit}
input.ltr{direction:ltr;text-align:left}.g2{display:grid;grid-template-columns:2fr 1fr;gap:10px}.g11{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;padding:50px 20px;color:var(--mut)}
#login{max-width:340px;margin:12vh auto}
</style>
</head>
<body>
<div id="login" class="card" hidden>
  <h1><i></i> Server Firefox</h1>
  <label>نام کاربری</label><input id="lu" class="ltr" autocomplete="username">
  <label>رمز</label><input id="lp" class="ltr" type="password" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <p><button class="pri" id="lbtn" style="width:100%">ورود</button></p>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <h1><i></i> Server Firefox <span class="mut" id="ver"></span></h1>
    <div><button class="pri" onclick="openForm()">+ سرور جدید</button> <button onclick="logout()">خروج</button></div>
  </header>
  <div id="list"></div>
</div>

<dialog id="dlg">
  <form method="dialog" id="frm" onsubmit="return false">
    <div class="name" id="ftitle">سرور جدید</div>
    <input type="hidden" name="ID">
    <label>نام (دلخواه)</label><input name="Name" placeholder="مثلاً آلمان ۱">
    <div class="g2"><div><label>IP سرور</label><input name="Host" class="ltr" required placeholder="1.2.3.4"></div>
      <div><label>پورت SSH</label><input name="SSHPort" class="ltr" type="number" value="22"></div></div>
    <div class="g11"><div><label>کاربر SSH</label><input name="SSHUser" class="ltr" value="root"></div>
      <div><label>رمز SSH</label><input name="SSHPass" class="ltr" type="password" autocomplete="new-password"></div></div>
    <label>دامنه (باید به IP همین سرور اشاره کند)</label><input name="Domain" class="ltr" required placeholder="fire.example.com">
    <div class="g11"><div><label>نام کاربری ورود به Firefox</label><input name="WebUser" class="ltr" value="firefox"></div>
      <div><label>رمز ورود به Firefox (حداقل ۸)</label><input name="WebPass" class="ltr" type="password" autocomplete="new-password"></div></div>
    <label>رزولوشن صفحه</label>
    <select name="Resolution"><option>1920x1080</option><option>1600x900</option><option>1366x768</option><option>1280x800</option><option>2560x1440</option></select>
    <label style="display:flex;gap:8px;align-items:center" id="hkrow"><input type="checkbox" name="ClearHostKey" style="width:auto"> پاک کردن کلید SSH ذخیره‌شده (اگر سرور را دوباره نصب کرده‌ای)</label>
    <p class="mut" id="fhint"></p>
    <div class="err" id="ferr"></div>
    <div class="acts"><button class="pri" onclick="save(true)">ذخیره و نصب</button><button onclick="save(false)">فقط ذخیره</button><button onclick="dlg.close()">انصراف</button></div>
  </form>
</dialog>

<script>
const B = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
const $ = s => document.querySelector(s);
const ST = {new:'نصب نشده', installing:'در حال نصب', installed:'نصب شده', failed:'ناموفق', removed:'حذف شده'};
const ACT = {install:'نصب', status:'وضعیت', restart:'ری‌استارت', uninstall:'حذف'};
let servers = [], open = {}, timers = {};
async function api(p, body) {
  const o = body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json','X-SF':'1'}, body:JSON.stringify(body)};
  const r = await fetch(B + 'api/' + p, o);
  if (r.status === 401 && p !== 'login') { show(false); throw new Error('login'); }
  const t = await r.text(); let j = {}; try { j = t ? JSON.parse(t) : {}; } catch (e) {}
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(authed){ $('#login').hidden = authed; $('#app').hidden = !authed; if(authed) load(); }
async function init(){ const j = await api('login'); $('#ver').textContent = 'v' + j.version; show(j.authed); }
$('#lbtn').onclick = async () => { $('#lerr').textContent='';
  try { await api('login', {User:$('#lu').value, Pass:$('#lp').value}); show(true); } catch(e){ $('#lerr').textContent = 'نام کاربری یا رمز اشتباه است'; } };
$('#lp').onkeydown = e => { if (e.key === 'Enter') $('#lbtn').click(); };
async function logout(){ await api('logout', {}); show(false); }
async function load(){
  servers = await api('servers');
  const L = $('#list');
  if (!servers.length) { L.innerHTML = '<div class="card empty">هنوز سروری اضافه نکرده‌ای.<br><br><button class="pri" onclick="openForm()">+ افزودن اولین سرور</button></div>'; return; }
  L.innerHTML = servers.map(s => {
    const st = s.Running ? 'installing' : s.Status, busy = !!s.Running;
    const label = s.Running ? 'در حال ' + ACT[s.Running] : (ST[s.Status] || s.Status);
    return `<div class="card" id="c-${s.ID}">
      <div class="row"><div><div class="name">${esc(s.Name)}</div><div class="meta">${esc(s.SSHUser)}@${esc(s.Host)}:${s.SSHPort} · ${esc(s.Domain)} · ${esc(s.Resolution)}</div></div>
      <span class="badge s-${st}">${label}</span></div>
      ${s.LastError ? `<div class="err">${esc(s.LastError)}</div>` : ''}
      <div class="acts">
        ${s.Status === 'installed' ? `<a class="btn pri" href="${esc(s.URL)}" target="_blank" rel="noopener">باز کردن Firefox ↗</a>` : `<button class="pri" ${busy?'disabled':''} onclick="run('${s.ID}','install')">نصب Firefox</button>`}
        <button ${busy?'disabled':''} onclick="run('${s.ID}','status')">وضعیت</button>
        <button ${busy?'disabled':''} onclick="run('${s.ID}','restart')">ری‌استارت Firefox</button>
        ${s.Status === 'installed' ? `<button ${busy?'disabled':''} onclick="run('${s.ID}','install')">نصب دوباره</button>` : ''}
        <button ${busy?'disabled':''} onclick="openForm('${s.ID}')">ویرایش</button>
        <button onclick="toggleLog('${s.ID}')">لاگ</button>
        <button class="danger" ${busy?'disabled':''} onclick="removeSrv('${s.ID}')">حذف</button>
      </div><pre id="log-${s.ID}" ${open[s.ID]?'':'hidden'}></pre></div>`;
  }).join('');
  for (const s of servers) { if (open[s.ID] || s.Running) { open[s.ID] = open[s.ID] || {from:0}; open[s.ID].from = 0; $('#log-'+s.ID).hidden = false; poll(s.ID); } }
}
function toggleLog(id){ const el = $('#log-'+id); if (open[id]) { delete open[id]; el.hidden = true; return; } open[id] = {from:0}; el.hidden = false; poll(id); }
async function poll(id){
  clearTimeout(timers[id]); const o = open[id]; if (!o) return;
  const el = $('#log-'+id); if (!el) return;
  try {
    const j = await api('log?id=' + id + '&from=' + o.from);
    if (o.from === 0) el.textContent = j.none ? 'هنوز کاری روی این سرور اجرا نشده.' : '';
    if (j.lines.length) { el.textContent += j.lines.join('\n') + '\n'; el.scrollTop = el.scrollHeight; }
    o.from = j.next;
    if (!j.done) timers[id] = setTimeout(() => poll(id), 1200);
    else if (o.wasRunning) { o.wasRunning = false; load(); }
    if (!j.done) o.wasRunning = true;
  } catch (e) {}
}
async function run(id, action){
  const s = servers.find(x => x.ID === id);
  if (action === 'uninstall' && !confirm('Firefox از ' + s.Name + ' حذف شود؟')) return;
  if (action === 'install' && s.Status === 'installed' && !confirm('دوباره نصب شود؟ تنظیمات و رمز جدید اعمال می‌شود.')) return;
  try { await api('run', {ID:id, Action:action}); open[id] = {from:0, wasRunning:true}; await load(); } catch (e) { alert(e.message); }
}
async function removeSrv(id){
  const s = servers.find(x => x.ID === id);
  const c = prompt('برای «' + s.Name + '»:\n۱ = Firefox را از خود سرور هم پاک کن، بعد از لیست حذف کن\n۲ = فقط از لیست حذف کن', '2');
  if (c === '1') { await run(id, 'uninstall'); return; }
  if (c === '2') { await api('delete', {ID:id}); delete open[id]; load(); }
}
function openForm(id){
  const f = $('#frm'); f.reset(); $('#ferr').textContent = '';
  const s = servers.find(x => x.ID === id);
  $('#ftitle').textContent = s ? 'ویرایش ' + s.Name : 'سرور جدید';
  $('#hkrow').hidden = !(s && s.HostKey);
  $('#fhint').textContent = s ? 'رمزها را خالی بگذار تا قبلی‌ها بمانند.' : 'قبل از نصب، رکورد A دامنه را روی IP سرور بگذار و پورت‌های 80 و 443 باز باشند. سیستم‌عامل: Ubuntu 22.04 / 24.04 یا Debian 12.';
  f.ID.value = s ? s.ID : '';
  if (s) for (const k of ['Name','Host','SSHPort','SSHUser','Domain','WebUser','Resolution']) f[k].value = s[k];
  dlg.showModal();
}
async function save(install){
  const f = $('#frm'), d = {};
  for (const k of ['ID','Name','Host','SSHUser','SSHPass','Domain','WebUser','WebPass','Resolution']) d[k] = f[k].value.trim();
  d.SSHPort = parseInt(f.SSHPort.value) || 22; d.ClearHostKey = f.ClearHostKey.checked;
  try { const j = await api('servers', d); dlg.close(); await load(); if (install) run(j.id, 'install'); }
  catch (e) { $('#ferr').textContent = e.message; }
}
init();
</script>
</body>
</html>
