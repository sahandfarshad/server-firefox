name: release
on:
  push:
    tags: ["v*"]
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go mod tidy && go vet ./... && bash -n remote.sh install.sh
      - name: Build (linux amd64 + arm64, static)
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$V" -o dist/server-firefox-linux-$arch .
          done
          cp install.sh dist/install.sh
          cd dist && sha256sum server-firefox-linux-amd64 server-firefox-linux-arm64 install.sh > SHA256SUMS && cat SHA256SUMS
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
